<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Página não encontrada — previdenciar.io</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg:#121417; --surface:#191C21; --fg:#ECEEF2; --muted:#B5BBC6; --border:#2C313A; --accent:#8DB4E8; --accent-ink:#0F1A28; }
  @media (prefers-color-scheme: light) { :root { --bg:#F7F4EC; --surface:#FFFDF8; --fg:#1D232B; --muted:#4F5B55; --border:#D6D1C4; --accent:#1E4B39; --accent-ink:#FFFFFF; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:460px; padding:32px 28px; border:1px solid var(--border); border-radius:16px; background:var(--surface); text-align:center; }
  img { width:56px; height:56px; border-radius:14px; }
  h1 { margin:18px 0 8px; font-size:24px; line-height:1.3; }
  p { margin:0 0 24px; color:var(--muted); }
  a.primary { display:inline-block; padding:11px 20px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:600; text-decoration:none; }
  a.primary:focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
  .links { margin-top:20px; font-size:14px; }
  .links a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/brand-icon.png" alt="previdenciar.io">
  <h1>Página não encontrada</h1>
  <p>O endereço que você abriu não existe ou mudou de lugar. Confira o link ou volte para a tela inicial.</p>
  <a class="primary" href="/">Voltar ao previdenciar.io</a>
  <div class="links"><a href="/termos.html">Termos de Uso</a> · <a href="/privacidade.html">Política de Privacidade</a></div>
</main>
</body>
</html>
