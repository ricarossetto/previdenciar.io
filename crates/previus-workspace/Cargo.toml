[package]
name = "previus-workspace"
version = "0.1.0"
edition = "2021"
description = "Private, review-first Previus Rust workspace and DPAPI persistence"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
previus-cnis = { path = "../previus-cnis" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
