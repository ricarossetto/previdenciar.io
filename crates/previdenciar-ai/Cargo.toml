[package]
name = "previdenciar-ai"
version = "0.1.0"
edition = "2021"
description = "Pluggable cloud AI bridge with explicit consent, local legal-data tools and DPAPI-backed keys"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
previdenciar-workspace = { path = "../previdenciar-workspace" }
unicode-normalization = "0.1"
pdf-extract = "0.7"

[dev-dependencies]
tempfile = "3"
