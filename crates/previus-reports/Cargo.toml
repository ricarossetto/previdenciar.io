[package]
name = "previus-reports"
version = "0.1.0"
edition = "2021"
description = "Native, explicit-outcome, multipage PDF review reports for Previus Rust"
license = "MIT"

[dependencies]
genpdf = "=0.2.0"
serde_json = "1"
rusttype = "0.8"
rust_decimal = "=1.43.0"
lopdf = "0.38"
typst-as-lib = "0.17"
typst = "0.15"
typst-pdf = "0.15"
previus-workspace = { path = "../previus-workspace" }
previus-cnis = { path = "../previus-cnis" }
previus-core = { path = "../previus-core" }
rgps-core = { path = "../rgps-core" }

[dev-dependencies]
previus-rgps = { path = "../previus-rgps" }
