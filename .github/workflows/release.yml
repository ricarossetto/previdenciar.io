name: Windows prerelease
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npx playwright install chromium
        working-directory: apps/desktop
      - run: npm run test:e2e
        working-directory: apps/desktop
      - run: node scripts/review-public-source.mjs
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p previus-next-desktop --bin previus-next-desktop
      - name: Verify embedded frontend in isolated native WebView
        shell: pwsh
        run: ./scripts/smoke-native.ps1
      - name: Build installer and updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Output 'Sem chave de assinatura; gerando apenas o instalador sem assinatura de atualização.' }
          npx tauri build --bundles nsis
        working-directory: apps/desktop
      - name: Package checksum and prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          $coreVersion = $version.Split('-')[0]
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($package.version -ne $coreVersion -or $config.version -ne $coreVersion) { throw 'Release tag and application versions disagree' }
          $name = "previdenciar.io-$version-windows-x64.exe"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath target/release/previus-next-desktop.exe -Destination "release/$name"
          $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          $installer = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $updaterAsset = ''
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination "release/$($installer.Name)"
            $sigFile = "$($installer.FullName).sig"
            if (Test-Path $sigFile) {
              $signature = (Get-Content -LiteralPath $sigFile -Raw).Trim()
              $updaterAsset = $installer.Name
              @{ version=$version; notes=(Get-Content '.github/RELEASE_NOTES.md' -Raw); pub_date=(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ'); platforms=@{ 'windows-x86_64'=@{ signature=$signature; url="https://github.com/ricarossetto/previdenciar.io/releases/download/$env:RELEASE_TAG/$($installer.Name)" } } } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath release/latest.json -Encoding utf8
            }
          }
          @{ commit=(git rev-parse HEAD); tag=$env:RELEASE_TAG; version=$coreVersion; product='previdenciar.io'; platform='windows-x64'; sha256=$hash; bytes=(Get-Item "release/$name").Length; signed=$false } | ConvertTo-Json | Set-Content -LiteralPath release/BUILDINFO.json -Encoding utf8
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; assets are not replaced automatically.'; exit 0 }
          $prereleaseFlag = if ($version.Contains('-')) { '--prerelease' } else { '' }
          $arguments = @($env:RELEASE_TAG, "release/$name", 'release/SHA256SUMS.txt', 'release/BUILDINFO.json')
          if ($installer) { $arguments += "release/$($installer.Name)" }
          if (Test-Path release/latest.json) { $arguments += 'release/latest.json' }
          $arguments += @('--verify-tag', '--title', "previdenciar.io $version", '--notes-file', '.github/RELEASE_NOTES.md')
          if ($prereleaseFlag) { $arguments += $prereleaseFlag }
          gh release create @arguments
